<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85520"/>
      <stop offset="100%" stop-color="#c44214"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a020"/>
      <stop offset="100%" stop-color="#e85520"/>
    </linearGradient>
  </defs>
  <!-- background card -->
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- radar concentric rings -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.2"/>
  <circle cx="32" cy="34" r="15" fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="1.2"/>
  <circle cx="32" cy="34" r="8" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  <!-- sweep wedge -->
  <path d="M32 34 L 54 34 A 22 22 0 0 0 42 14 Z" fill="rgba(255,255,255,0.30)"/>
  <!-- pin / location marker centered -->
  <path d="M32 18 C 27 18 23 22 23 27 C 23 33.5 32 42 32 42 C 32 42 41 33.5 41 27 C 41 22 37 18 32 18 Z"
        fill="#ffffff"/>
  <circle cx="32" cy="27" r="3.5" fill="url(#gradAccent)"/>
  <!-- blip -->
  <circle cx="46" cy="22" r="1.6" fill="#fff7ed"/>
</svg>
